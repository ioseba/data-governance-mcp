[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-governance-mcp"
version = "0.1.0"
description = "Enterprise-grade DAMA-DMBOK data quality audit & PII compliance MCP Server for AI agents (Claude, Cursor, Antigravity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ioseba Alonso", email = "ialonso@ghifurnaces.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "data-quality",
    "data-governance",
    "dama",
    "dmbok",
    "cdmp",
    "pii-detection",
    "ai-agents",
    "claude-desktop",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
parquet = [
    "pyarrow>=14.0.0",
]

[project.scripts]
data-governance-mcp = "data_governance_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ioseba/data-governance-mcp"
Repository = "https://github.com/ioseba/data-governance-mcp"
Issues = "https://github.com/ioseba/data-governance-mcp/issues"
