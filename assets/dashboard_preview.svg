<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
  </style>

  <!-- Container Window Frame -->
  <rect x="15" y="15" width="970" height="550" rx="14" fill="url(#dbBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Header Bar -->
  <rect x="15" y="15" width="970" height="42" rx="14" fill="#0f172a" />
  <rect x="15" y="45" width="970" height="12" fill="#0f172a" />
  <line x1="15" y1="57" x2="985" y2="57" stroke="#1e293b" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="40" cy="36" r="6" fill="#ef4444" />
  <circle cx="58" cy="36" r="6" fill="#f59e0b" />
  <circle cx="76" cy="36" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="500" y="40" fill="#94a3b8" class="sans" font-size="12" font-weight="600" text-anchor="middle">Data Governance Audit Dashboard &bull; industrial_furnace_telemetry.csv</text>

  <!-- Dashboard Header Content -->
  <g transform="translate(45, 80)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="165" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="82" y="16" fill="#38bdf8" class="sans" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">DAMA-DMBOK AUDIT REPORT</text>

    <!-- Main Title -->
    <text x="0" y="48" fill="#f8fafc" class="sans" font-size="24" font-weight="800">Executive Data Quality &amp; Governance Audit</text>
    <text x="0" y="70" fill="#94a3b8" class="sans" font-size="12">
      Target: <tspan fill="#38bdf8" class="mono">industrial_furnace_telemetry.csv</tspan> &bull; Total Records: <tspan fill="#f8fafc" font-weight="600">12,500</tspan> &bull; Monitored Dimensions: <tspan fill="#f8fafc" font-weight="600">6</tspan>
    </text>

    <!-- Score Circle Gauge -->
    <g transform="translate(800, -5)">
      <circle cx="45" cy="45" r="42" fill="#0f172a" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
      <circle cx="45" cy="45" r="42" fill="none" stroke="#10b981" stroke-width="4.5" stroke-dasharray="245" stroke-dashoffset="14" stroke-linecap="round" />
      <text x="45" y="44" fill="#10b981" class="sans" font-size="24" font-weight="800" text-anchor="middle">94.6</text>
      <text x="45" y="60" fill="#94a3b8" class="sans" font-size="9" font-weight="600" text-anchor="middle">/ 100 DAMA</text>
    </g>
  </g>

  <!-- Left Card: Radar Chart -->
  <g transform="translate(45, 175)">
    <rect x="0" y="0" width="435" height="260" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" fill="#38bdf8" class="sans" font-size="12" font-weight="700" letter-spacing="0.8">DAMA RADAR DISTRIBUTION</text>
    <line x1="20" y1="38" x2="415" y2="38" stroke="#334155" stroke-width="0.8" />

    <!-- Radar SVG Visual -->
    <g transform="translate(215, 150)">
      <!-- Outer grid -->
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />
      <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" />
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" />

      <!-- Axes -->
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="69" y2="-40" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="69" y2="40" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="80" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="-69" y2="40" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="-69" y2="-40" stroke="#334155" stroke-width="1" />

      <!-- Data Polygon (Filled) -->
      <polygon points="0,-78 68,-38 58,34 0,72 -68,39 -66,-38" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2.2" />

      <!-- Labels -->
      <text x="0" y="-90" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="middle">Completeness (97.8%)</text>
      <text x="82" y="-40" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="start">Uniqueness (84.6%)</text>
      <text x="82" y="44" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="start">Validity (100%)</text>
      <text x="0" y="96" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="middle">Accuracy (89.5%)</text>
      <text x="-82" y="44" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="end">Consistency (100%)</text>
      <text x="-82" y="-40" fill="#cbd5e1" class="sans" font-size="10" font-weight="600" text-anchor="end">Timeliness (95.0%)</text>
    </g>
  </g>

  <!-- Right Card: Metric Progress Bars -->
  <g transform="translate(500, 175)">
    <rect x="0" y="0" width="455" height="260" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" fill="#38bdf8" class="sans" font-size="12" font-weight="700" letter-spacing="0.8">DIMENSION SCORE BREAKDOWN</text>
    <line x1="20" y1="38" x2="435" y2="38" stroke="#334155" stroke-width="0.8" />

    <!-- Bar 1: Completeness -->
    <g transform="translate(20, 52)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Completeness</text>
      <text x="415" y="12" fill="#10b981" class="sans" font-size="12" font-weight="700" text-anchor="end">97.8% (PASS)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="405" height="6" rx="3" fill="#10b981" />
    </g>

    <!-- Bar 2: Uniqueness -->
    <g transform="translate(20, 84)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Uniqueness</text>
      <text x="415" y="12" fill="#ef4444" class="sans" font-size="12" font-weight="700" text-anchor="end">84.6% (FAIL)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="351" height="6" rx="3" fill="#ef4444" />
    </g>

    <!-- Bar 3: Validity -->
    <g transform="translate(20, 116)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Validity</text>
      <text x="415" y="12" fill="#10b981" class="sans" font-size="12" font-weight="700" text-anchor="end">100.0% (PASS)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#10b981" />
    </g>

    <!-- Bar 4: Accuracy -->
    <g transform="translate(20, 148)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Accuracy (Tukey IQR)</text>
      <text x="415" y="12" fill="#f59e0b" class="sans" font-size="12" font-weight="700" text-anchor="end">89.5% (WARN)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="371" height="6" rx="3" fill="#f59e0b" />
    </g>

    <!-- Bar 5: Consistency -->
    <g transform="translate(20, 180)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Consistency</text>
      <text x="415" y="12" fill="#10b981" class="sans" font-size="12" font-weight="700" text-anchor="end">100.0% (PASS)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#10b981" />
    </g>

    <!-- Bar 6: Timeliness -->
    <g transform="translate(20, 212)">
      <text x="0" y="12" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Timeliness</text>
      <text x="415" y="12" fill="#10b981" class="sans" font-size="12" font-weight="700" text-anchor="end">95.0% (PASS)</text>
      <rect x="0" y="18" width="415" height="6" rx="3" fill="#334155" />
      <rect x="0" y="18" width="394" height="6" rx="3" fill="#10b981" />
    </g>
  </g>

  <!-- Bottom Card: PII Risk Rating & Action Strip -->
  <g transform="translate(45, 450)">
    <rect x="0" y="0" width="910" height="90" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />

    <text x="24" y="32" fill="#f43f5e" class="sans" font-size="14" font-weight="700">Security &amp; Privacy: HIGH RISK (2 PII findings flagged)</text>
    <text x="24" y="55" fill="#94a3b8" class="sans" font-size="12">
      Column <tspan fill="#cbd5e1" class="mono">operator_email</tspan> matches sensitive keyword &bull; Found 8 unmasked email patterns.
    </text>
    <text x="24" y="73" fill="#38bdf8" class="sans" font-size="11" font-weight="600">
      Recommended: Run `data-governance-mcp twin` to generate differential-privacy digital twin before LLM ingestion.
    </text>

    <!-- Synthetic Twin Required Badge -->
    <rect x="710" y="24" width="180" height="38" rx="8" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1.2" />
    <text x="800" y="47" fill="#f43f5e" class="sans" font-size="11" font-weight="800" text-anchor="middle">SYNTHETIC TWIN REQUIRED</text>
  </g>
</svg>
