<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .header-box { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
      .dim-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #0f172a; }
      .dim-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-style: italic; font-size: 12px; fill: #64748b; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Figure Title & Subtitle (Academic Paper Header) -->
  <text x="40" y="42" class="title">Figure 1. Architectural Workflow of the Data Governance MCP Protocol</text>
  <text x="40" y="64" class="subtitle">Standardized DAMA-DMBOK data quality validation and zero-trust PII sanitization between raw storage and LLM agents.</text>
  <line x1="40" y1="78" x2="1060" y2="78" stroke="#e2e8f0" stroke-width="1" />

  <!-- STAGE 1: RAW DATA SOURCES -->
  <g transform="translate(40, 100)">
    <rect width="200" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="200" height="38" rx="8" fill="#e2e8f0" />
    <text x="16" y="24" class="header-box" fill="#1e293b">1. Heterogeneous Data</text>

    <!-- Source Items -->
    <g transform="translate(16, 55)">
      <rect width="168" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)" />
      <text x="12" y="24" class="badge-text" fill="#2563eb">CSV / TSV / Delimited</text>
      <text x="12" y="44" class="body-text">Sniffs separators &amp; types</text>
    </g>

    <g transform="translate(16, 130)">
      <rect width="168" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)" />
      <text x="12" y="24" class="badge-text" fill="#0284c7">Parquet &amp; PyArrow</text>
      <text x="12" y="44" class="body-text">Columnar &amp; metadata scan</text>
    </g>

    <g transform="translate(16, 205)">
      <rect width="168" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)" />
      <text x="12" y="24" class="badge-text" fill="#7c3aed">SQLite / SQL Tables</text>
      <text x="12" y="44" class="body-text">Table schema &amp; sample load</text>
    </g>

    <g transform="translate(16, 280)">
      <rect width="168" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)" />
      <text x="12" y="24" class="badge-text" fill="#475569">JSON &amp; Inline Snippets</text>
      <text x="12" y="44" class="body-text">Dynamic memory buffers</text>
    </g>

    <rect x="16" y="360" width="168" height="36" rx="6" fill="#fee2e2" stroke="#fca5a5" />
    <text x="24" y="382" class="badge-text" fill="#991b1b">⚠️ Unverified Raw State</text>
  </g>

  <!-- Connectors from Stage 1 to Stage 2 -->
  <line x1="240" y1="305" x2="280" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- STAGE 2: DATA GOVERNANCE ENGINE (CORE CONTAINER) -->
  <g transform="translate(285, 100)">
    <rect width="470" height="410" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="470" height="38" rx="8" fill="#eff6ff" />
    <text x="20" y="24" class="header-box" fill="#1d4ed8">2. data-governance-mcp Core Engine</text>

    <!-- Sub-Block A: DAMA-DMBOK 6 Dimensions -->
    <rect x="16" y="50" width="438" height="205" rx="6" fill="#ffffff" stroke="#bfdbfe" filter="url(#card-shadow)" />
    <text x="28" y="72" class="header-box" fill="#1e40af">DAMA-DMBOK 6 Quality Dimensions Evaluator</text>

    <!-- Grid of 6 dimensions -->
    <g transform="translate(28, 85)">
      <!-- Dim 1 -->
      <text x="0" y="16" class="dim-title">• Completeness (22%)</text>
      <text x="12" y="30" class="dim-desc">Null ratios &amp; blank whitespace detection</text>
      <!-- Dim 2 -->
      <text x="0" y="54" class="dim-title">• Uniqueness (18%)</text>
      <text x="12" y="68" class="dim-desc">Row duplication &amp; primary key viability</text>
      <!-- Dim 3 -->
      <text x="0" y="92" class="dim-title">• Validity (22%)</text>
      <text x="12" y="106" class="dim-desc">Schema types &amp; text-in-numeric checks</text>

      <!-- Dim 4 -->
      <text x="215" y="16" class="dim-title">• Accuracy (16%)</text>
      <text x="227" y="30" class="dim-desc">Tukey 2.5 IQR &amp; Z-score outlier fences</text>
      <!-- Dim 5 -->
      <text x="215" y="54" class="dim-title">• Consistency (12%)</text>
      <text x="227" y="68" class="dim-desc">Chronology &amp; cross-field logical sanity</text>
      <!-- Dim 6 -->
      <text x="215" y="92" class="dim-title">• Timeliness (10%)</text>
      <text x="227" y="106" class="dim-desc">Temporal span &amp; freshness cadence</text>
    </g>

    <!-- Sub-Block B: PII & Security Guardrail -->
    <rect x="16" y="268" width="438" height="125" rx="6" fill="#ffffff" stroke="#fecaca" filter="url(#card-shadow)" />
    <text x="28" y="292" class="header-box" fill="#b91c1c">Zero-Trust PII &amp; Sensitive Leakage Detector</text>

    <g transform="translate(28, 305)">
      <text x="0" y="16" class="dim-title">Confidential Patterns:</text>
      <text x="130" y="16" class="dim-desc">Emails, Phones, Cards, DNI/NIE, API Keys, Tokens</text>
      <text x="0" y="38" class="dim-title">Header Heuristics:</text>
      <text x="130" y="38" class="dim-desc">Flags columns like 'password', 'salary', 'secret', 'iban'</text>
      
      <rect x="0" y="48" width="410" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" />
      <text x="10" y="66" class="badge-text" fill="#b91c1c">🛡️ Prevents confidential data from leaking into LLM context</text>
    </g>
  </g>

  <!-- Connectors from Stage 2 to Stage 3 -->
  <line x1="755" y1="305" x2="795" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- STAGE 3: MCP & HOST AGENTS -->
  <g transform="translate(800, 100)">
    <rect width="260" height="410" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="1.5" />
    <rect width="260" height="38" rx="8" fill="#ecfdf5" />
    <text x="16" y="24" class="header-box" fill="#065f46">3. AI Agent Ecosystem</text>

    <!-- MCP Protocol Bridge -->
    <g transform="translate(16, 50)">
      <rect width="228" height="105" rx="6" fill="#ffffff" stroke="#a7f3d0" filter="url(#card-shadow)" />
      <text x="12" y="24" class="badge-text" fill="#047857">Model Context Protocol</text>
      <text x="12" y="44" class="dim-desc">• audit_dataset (Markdown report)</text>
      <text x="12" y="62" class="dim-desc">• profile_schema (JSON stats)</text>
      <text x="12" y="80" class="dim-desc">• detect_pii (Risk classification)</text>
      <text x="12" y="98" class="dim-desc">• suggest_remediations (Python/SQL)</text>
    </g>

    <!-- Host Agents -->
    <g transform="translate(16, 170)">
      <rect width="228" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)" />
      <text x="12" y="24" class="header-box" fill="#1e293b">Supported AI Hosts</text>
      
      <rect x="12" y="36" width="95" height="28" rx="4" fill="#f1f5f9" />
      <text x="20" y="54" class="badge-text" fill="#334155">Claude Desktop</text>

      <rect x="115" y="36" width="95" height="28" rx="4" fill="#f1f5f9" />
      <text x="136" y="54" class="badge-text" fill="#334155">Cursor</text>

      <rect x="12" y="72" width="95" height="28" rx="4" fill="#f1f5f9" />
      <text x="20" y="90" class="badge-text" fill="#334155">Antigravity</text>

      <rect x="115" y="72" width="95" height="28" rx="4" fill="#f1f5f9" />
      <text x="142" y="90" class="badge-text" fill="#334155">Cline</text>

      <text x="12" y="122" class="dim-desc">Standard stdio JSON-RPC transport</text>
    </g>

    <!-- Safe Outcome Badge -->
    <g transform="translate(16, 320)">
      <rect width="228" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="12" y="24" class="badge-text" fill="#166534">✅ Guaranteed Outcome:</text>
      <text x="12" y="44" class="dim-desc">Zero hallucinations from dirty data</text>
      <text x="12" y="62" class="dim-desc">Zero PII leakage to LLM prompts</text>
    </g>
  </g>

  <!-- Bottom Academic Footer Note -->
  <text x="40" y="545" class="caption">Methodology based on DAMA International Guide to the Data Management Body of Knowledge (DAMA-DMBOK2) &amp; Anthropic Model Context Protocol (v1.x specification).</text>
</svg>
